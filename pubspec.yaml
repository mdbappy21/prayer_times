name: prayer_time
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  hijri: ^3.0.0
  intl: ^0.20.2
  prayers_times: ^0.0.6
  get: ^4.7.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/


